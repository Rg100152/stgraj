[project]
name = "stgraj"
version = "3.2.0"
description = "Advanced System Monitor with htop-style interface and cyberpunk UI"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [
    { name = "Raj Gautam", email = "rajgautam@gmail.com" }
]
keywords = [
    "system-monitor", "htop", "cyberpunk", "monitoring",
    "process", "cpu", "memory", "disk", "network", "cli", "terminal"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities"
]

[project.urls]
homepage = "https://github.com/rajgautam/stgraj"
repository = "https://github.com/rajgautam/stgraj"
documentation = "https://github.com/rajgautam/stgraj/blob/main/README.md"
issues = "https://github.com/rajgautam/stgraj/issues"

[project.dependencies]
psutil = ">=5.9.0"
rich = ">=13.0.0"
pyfiglet = ">=1.0.2"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
stgraj = "stgraj:main"
stgraj-monitor = "stgraj:main"

[build-system]
requires = [
    "setuptools>=68.0.0",
    "wheel>=0.41.0"
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stgraj"]
include-package-data = true
py-modules = ["stgraj"]

[tool.setuptools.package-data]
stgraj = ["*.json", "*.toml", "*.md", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=stgraj --cov-report=term-missing"

[tool.coverage.run]
source = ["stgraj"]
omit = ["tests/*", "setup.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]

[tool.black]
line-length = 120
target-version = ["py37", "py38", "py39", "py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
line-length = 120
target-version = "py37"
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "C", "P", "R", "RET", "SIM", "T20"]
ignore = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C", "P", "R", "RET", "SIM", "T20"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["stgraj"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"setup.py" = ["D", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.isort]
known-first-party = ["stgraj"]
known-third-party = ["psutil", "rich", "pyfiglet"]
lines-after-imports = 2
order-by-type = true